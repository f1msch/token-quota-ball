name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  python:
    name: Python 测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: 运行 Pytest
        env:
          PYTHONPATH: src
        run: pytest -q

  ui:
    name: 前端构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/ui/package-lock.json
      - name: 安装根依赖
        run: npm ci
      - name: 安装前端依赖
        run: npm --prefix src/ui ci
      - name: 构建前端
        run: npm run build:ui

  rust:
    name: Rust 检查
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # tauri.conf 声明了 sidecar 资源，但 binaries/ 被 gitignore；
      # CI 只做 cargo check，放一个占位文件即可，不必跑完整 PyInstaller。
      - name: 准备 API sidecar 占位文件
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src/tauri/binaries | Out-Null
          # 最小 MZ 头，满足「文件存在」校验
          [System.IO.File]::WriteAllBytes(
            "src/tauri/binaries/token-quota-ball-api.exe",
            [byte[]](0x4D, 0x5A)
          )
      - name: cargo check
        working-directory: src/tauri
        run: cargo check
